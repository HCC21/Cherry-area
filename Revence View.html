<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>咖啡店每週營運內部對比系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <header class="bg-amber-800 text-white shadow-md px-4 py-4">
        <h1 class="text-lg font-bold tracking-wide">Revence Review</h1>
    </header>
    <main class="mx-auto p-3 space-y-4 max-w-7xl">
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-sm font-bold text-gray-800 border-b pb-2 mb-3">📝 輸入本週營運數據</h2>
            <form id="dataForm" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">分店代號</label>
                    <input type="text" id="inputShopCode" required placeholder="A01, B02" class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">開始日期</label>
                        <input type="date" id="startDate" required class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">結束日期</label>
                        <input type="text" id="endDate" readonly placeholder="自動計算" class="w-full bg-gray-50 border border-gray-300 text-gray-500 rounded-lg px-2 py-2 text-sm cursor-not-allowed outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Revenue ($)</label>
                    <input type="number" id="inputRevenue" required placeholder="50000" class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">TC</label>
                    <input type="number" id="inputTC" required placeholder="1000" class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Food Sales ($)</label>
                    <input type="number" id="inputFoodSales" required placeholder="15000" class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Food Waste ($)</label>
                    <input type="number" id="inputFoodWaste" required placeholder="600" class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Other (Notes)</label>
                    <input type="text" id="inputOtherNotes" placeholder="雜項/周邊" class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-gray-500 mb-1">營運備註 (Notes)</label>
                    <input type="text" id="inputGeneralNotes" placeholder="天氣、推廣等，長文字會自動換行" class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <input type="hidden" id="editIndex" value="">
                <div class="sm:col-span-2 flex justify-end gap-2 mt-1">
                    <button type="button" id="clearFormBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-medium px-3 py-2.5 rounded-lg transition">🗑️ 清空輸入</button>
                    <button type="submit" id="submitBtn" class="bg-amber-600 hover:bg-amber-700 text-white text-sm font-medium px-4 py-2.5 rounded-lg transition shadow-sm">➕ 新增數據</button>
                </div>
            </form>
            <div id="syncStatus" class="text-xs mt-2"></div>
        </section>
        <section class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-3 py-3 border-b flex justify-between items-center flex-wrap gap-2">
                <h3 class="text-sm font-bold text-gray-800">歷史數據對比</h3>
                <div class="flex items-center gap-2">
                    <label class="text-xs text-gray-500">分店篩選：</label>
                    <select id="shopFilter" class="border border-gray-300 rounded px-2 py-1 text-xs">
                        <option value="">全部分店</option>
                    </select>
                </div>
                <span class="text-xs text-gray-400">💡 自動對比上週，▲升綠 ▼跌紅</span>
            </div>
            <div class="table-wrap">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-100 font-semibold text-gray-500">
                            <th class="py-2 px-2">分店</th>
                            <th class="py-2 px-2">期間</th>
                            <th class="py-2 px-2">Revenue</th>
                            <th class="py-2 px-2">TC</th>
                            <th class="py-2 px-2">AC</th>
                            <th class="py-2 px-2">Food Sales</th>
                            <th class="py-2 px-2">Food Waste<br />WasteRate</th>
                            <th class="py-2 px-2">Other</th>
                            <th class="py-2 px-2">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100 text-gray-700">
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script>
        const STORAGE_KEY = 'cafeWeeklyData';
        const GOOGLE_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyOmNLn6PUKcKc3N7s2MFIVWVLfJK9QIW2qmHVgJqkrNRw79dd2RRag3zlmnaPEyCxQqg/exec";
        const startDateInput = document.getElementById('startDate');
        const endDateInput = document.getElementById('endDate');
        const inputShopCode = document.getElementById('inputShopCode');
        const inputRevenue = document.getElementById('inputRevenue');
        const inputTC = document.getElementById('inputTC');
        const inputFoodSales = document.getElementById('inputFoodSales');
        const inputFoodWaste = document.getElementById('inputFoodWaste');
        const inputOtherNotes = document.getElementById('inputOtherNotes');
        const inputGeneralNotes = document.getElementById('inputGeneralNotes');
        const editIndexInput = document.getElementById('editIndex');
        const submitBtn = document.getElementById('submitBtn');
        const clearFormBtn = document.getElementById('clearFormBtn');
        const dataForm = document.getElementById('dataForm');
        const tableBody = document.getElementById('tableBody');
        const syncStatus = document.getElementById('syncStatus');
        const shopFilter = document.getElementById('shopFilter');

        function getData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : [];
        }
        function saveData(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }
        // 自動同步去 Google Sheet
        async function syncToSheet(){
            syncStatus.textContent = "⏳ 正在同步至 Google Sheet...";
            syncStatus.className = "text-xs mt-2 text-blue-500";
            try {
                await fetch(GOOGLE_WEBAPP_URL,{
                    method:"POST",
                    mode:"no-cors",
                    body:JSON.stringify({data:getData()}),
                    headers:{"Content-Type":"text/plain;charset=UTF-8"}
                });
                syncStatus.textContent = "✅ 已自動同步到 Google Sheet";
                syncStatus.className = "text-xs mt-2 text-green-500";
            } catch(err){
                syncStatus.textContent = "❌ 同步失敗";
                syncStatus.className = "text-xs mt-2 text-red-500";
            }
        }
        function getDiffHtml(current, prev) {
            if (prev === null || prev === 0) return `<span class="text-gray-400">-</span>`;
            const pct = ((current - prev) / prev) * 100;
            const fixed = pct.toFixed(1);
            if(pct > 0){
                return `<span class="text-green-600">▲ ${fixed}%</span>`;
            }else if(pct < 0){
                return `<span class="text-red-600">▼ ${fixed}%</span>`;
            }else{
                return `<span class="text-gray-500">− 0.0%</span>`;
            }
        }
        startDateInput.addEventListener('change', function(){
            if(this.value){
                const d = new Date(this.value);
                d.setDate(d.getDate() + 6);
                const y = d.getFullYear();
                const m = String(d.getMonth()+1).padStart(2,'0');
                const day = String(d.getDate()).padStart(2,'0');
                endDateInput.value = `${y}-${m}-${day}`;
            }else{
                endDateInput.value = "";
            }
        })

        // 更新分店篩選下拉選項
        function refreshShopFilterOptions(){
            const list = getData();
            const exist = new Set();
            list.forEach(i=>exist.add(i.shopCode));
            const currentSel = shopFilter.value;
            shopFilter.innerHTML = `<option value="">全部分店</option>`;
            Array.from(exist).sort().forEach(code=>{
                const opt = document.createElement('option');
                opt.value = code;
                opt.textContent = code;
                shopFilter.appendChild(opt);
            })
            if(exist.has(currentSel)) shopFilter.value = currentSel;
            else shopFilter.value = "";
        }

        function renderTable(){
            refreshShopFilterOptions();
            const list = getData();
            const filterShop = shopFilter.value;
            tableBody.innerHTML = "";
            const group = {};
            list.forEach((item, idx)=>{
                if(!group[item.shopCode]) group[item.shopCode] = [];
                group[item.shopCode].push({...item, idx});
            })
            Object.values(group).forEach(arr=>{
                arr.sort((a,b)=> new Date(a.start) - new Date(b.start));
            })
            let sortedAll = [];
            Object.values(group).forEach(g=> sortedAll = sortedAll.concat(g));
            sortedAll.sort((a,b)=> new Date(b.start) - new Date(a.start));

            // 套用篩選
            if(filterShop){
                sortedAll = sortedAll.filter(r=> r.shopCode === filterShop);
            }

            sortedAll.forEach((item)=>{
                const shopList = group[item.shopCode];
                const pos = shopList.findIndex(x=>x.idx === item.idx);
                const prevItem = pos > 0 ? shopList[pos-1] : null;
                const ac = item.tc > 0 ? (item.revenue / item.tc).toFixed(1) : 0;
                const foodTotal = item.foodSales + item.foodWaste;
                const wasteRate = foodTotal > 0 ? ((item.foodWaste / foodTotal)*100).toFixed(1) : 0;
                const color = wasteRate >=5 ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-600';
                const tr = document.createElement('tr');
                tr.className = "hover:bg-amber-50/20 bg-white font-medium transition-colors";
                tr.innerHTML = `
                    <td class="py-2 px-2 font-bold text-amber-800">${item.shopCode}</td>
                    <td class="py-2 px-2 text-gray-900 font-bold">${item.start}<br>${item.end}</td>
                    <td class="py-2 px-2">$${Number(item.revenue).toLocaleString()}<br>${prevItem ? getDiffHtml(item.revenue, prevItem.revenue) : `<span class="text-gray-400">-</span>`}</td>
                    <td class="py-2 px-2">${Number(item.tc).toLocaleString()}<br>${prevItem ? getDiffHtml(item.tc, prevItem.tc) : `<span class="text-gray-400">-</span>`}</td>
                    <td class="py-2 px-2">$${ac}<br>${prevItem ? getDiffHtml(Number(ac), Number(prevItem.tc>0 ? prevItem.revenue/prevItem.tc : 0)) : `<span class="text-gray-400">-</span>`}</td>
                    <td class="py-2 px-2">$${Number(item.foodSales).toLocaleString()}<br>${prevItem ? getDiffHtml(item.foodSales, prevItem.foodSales) : `<span class="text-gray-400">-</span>`}</td>
                    <td class="py-2 px-2 text-red-600">
                        $${Number(item.foodWaste).toLocaleString()}<br>${prevItem ? getDiffHtml(item.foodWaste, prevItem.foodWaste) : `<span class="text-gray-400">-</span>`}
                        <span class="text-xs ${color} px-1 py-0.5 rounded ml-0.5">${wasteRate}%</span>
                    </td>
                    <td class="py-2 px-2 text-gray-500">${item.otherNotes || ''}</td>
                    <td class="py-2 px-2">
                        <button data-idx="${item.idx}" class="editBtn text-blue-500 hover:text-blue-700 p-1">修改</button>
                        <button data-idx="${item.idx}" class="delBtn text-red-500 hover:text-red-700 p-1">刪除</button>
                    </td>
                `;
                tableBody.appendChild(tr);
// 如果有營運備註，加多一行，貫穿全部9欄
                if(item.generalNotes && item.generalNotes.trim() !== "" && item.generalNotes !== "無備註"){
                    const noteTr = document.createElement('tr');
                    noteTr.className = "bg-amber-50";
                    noteTr.innerHTML = `<td colspan="9" class="px-3 py-1.5 text-gray-600 italic">📌 營運備註：${item.generalNotes}</td>`;
                    tableBody.appendChild(noteTr);
                }
            })
            document.querySelectorAll('.editBtn').forEach(btn=>{
                btn.onclick = ()=>{
                    const i = Number(btn.dataset.idx);
                    const all = getData();
                    const row = all[i];
                    inputShopCode.value = row.shopCode;
                    startDateInput.value = row.start;
                    endDateInput.value = row.end;
                    inputRevenue.value = row.revenue;
                    inputTC.value = row.tc;
                    inputFoodSales.value = row.foodSales;
                    inputFoodWaste.value = row.foodWaste;
                    inputOtherNotes.value = row.otherNotes;
                    inputGeneralNotes.value = row.generalNotes;
                    editIndexInput.value = i;
                    submitBtn.textContent = "✏️ 更新數據";
                }
            })
            document.querySelectorAll('.delBtn').forEach(btn=>{
                btn.onclick = ()=>{
                    if(!confirm("確認刪除？")) return;
                    const i = Number(btn.dataset.idx);
                    const arr = getData();
                    arr.splice(i,1);
                    saveData(arr);
                    renderTable();
                    syncToSheet(); // 刪除都自動同步
                }
            })
        }

        // 篩選變更就重新渲染表格
        shopFilter.addEventListener('change', renderTable);

        function clearForm(){
            dataForm.reset();
            endDateInput.value = "";
            editIndexInput.value = "";
            submitBtn.textContent = "➕ 新增數據";
        }
        clearFormBtn.onclick = clearForm;
        dataForm.onsubmit = async function(e){
            e.preventDefault();
            const row = {
                shopCode: inputShopCode.value.trim(),
                start: startDateInput.value,
                end: endDateInput.value,
                revenue: Number(inputRevenue.value),
                tc: Number(inputTC.value),
                foodSales: Number(inputFoodSales.value),
                foodWaste: Number(inputFoodWaste.value),
                otherNotes: inputOtherNotes.value.trim() || "無備註",
                generalNotes: inputGeneralNotes.value.trim() || "無備註"
            }
            const arr = getData();
            const editIdx = editIndexInput.value;
            if(editIdx !== ""){
                arr[Number(editIdx)] = row;
            }else{
                arr.push(row);
            }
            saveData(arr);
            clearForm();
            renderTable();
            await syncToSheet(); // ✅ 新增 / 更新完成，自動同步
        }
        renderTable();
    </script>
</body>
</html>
